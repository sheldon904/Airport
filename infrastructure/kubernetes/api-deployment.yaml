# API Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airport-api
  namespace: airport
  labels:
    app: airport
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airport
      component: api
  template:
    metadata:
      labels:
        app: airport
        component: api
    spec:
      containers:
        - name: api
          image: airport/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: airport-secrets
            - configMapRef:
                name: airport-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: airport-api
  namespace: airport
spec:
  selector:
    app: airport
    component: api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airport-api
  namespace: airport
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.airport.app
      secretName: airport-api-tls
  rules:
    - host: api.airport.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airport-api
                port:
                  number: 80
